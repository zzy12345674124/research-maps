<!DOCTYPE html>
<html lang="zh-CN" data-workspace-state="loading">
<head>

  <script src="../scripts/interactions/workspace-navigation.js?v=20261025-journal88"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>期刊双图叠加：语义嵌入布局</title>

  <!-- 功能：首屏先显示加载状态，隐藏原独立演示布局；visibility保留尺寸供SVG布局计算。 -->
  <style>
    html[data-workspace-state="loading"] body > :not(#workspace-startup):not(noscript),
    html[data-workspace-state="error"] body > :not(#workspace-startup):not(noscript){visibility:hidden!important;pointer-events:none!important}
    #workspace-startup{position:fixed;inset:0;z-index:10000;margin:0;padding:24px;background:#fafcfd;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font:15px/1.8 "Microsoft YaHei",sans-serif;color:#607882;text-align:center;visibility:visible!important}
    #workspace-startup .startup-mark{width:25px;height:25px;border-radius:50%;background:#267d89;box-shadow:10px -5px 0 -5px #9bc8ac;margin-bottom:10px}
    #workspace-startup strong{font-size:18px;color:#2e4b58;font-weight:500}#workspace-startup p{max-width:580px;margin:0;overflow-wrap:anywhere}
    #workspace-startup button{font:inherit;color:#267d89;border:1px solid #bcd7dc;border-radius:4px;background:#edf6f7;padding:7px 18px;cursor:pointer}
    #workspace-startup button[hidden],html[data-workspace-state="ready"] #workspace-startup{display:none!important}
  </style>
  <script src="../scripts/interactions/workspace-startup.js?v=20261021-startup19"></script>
<script src="../library/d3/d3.v7.min.js"></script>

<link rel="stylesheet" href="../css/dual-map.css?v=20261022-cellcool40">
<link rel="stylesheet" href="../css/glass.css?v=20261022-perf26">

<script src="../library/vue-primevue/research-maps-ui.js?v=20261025-journal88"></script>
</head>
<body>
  <div id="workspace-startup" role="status" aria-live="polite"><span class="startup-mark" aria-hidden="true"></span><strong>正在加载文献计量工作台…</strong><p>正在准备图形和参数，请稍候。</p><button type="button" hidden>重新加载</button></div>
  <noscript><style>#workspace-startup{display:none!important}</style><p>请启用JavaScript后重新打开工作台。</p></noscript>

<h2>期刊双图叠加：语义嵌入布局</h2>
<div class="note">左侧引用方期刊，右侧被引方期刊。基于当前样本及缓存参考文献汇总论文嵌入，再统一UMAP降维；每个圆代表期刊，连线表示已记录引用。左右面板间隔不表达语义距离。</div>
<div class="toolbar"><label>节点大小 <input id="journal-node-size" type="range" min="0.5" max="2" step="0.1" value="1"></label><label>突出前几条路径 <input id="major-paths" type="number" min="1" max="100" value="5"></label></div>
<div class="toolbar"><label>引用方学科 <select id="left-filter"></select></label><label>被引方学科 <select id="right-filter"></select></label><label>期刊间最少引用 <input id="minimum" type="number" min="1" value="1"></label><button id="apply" type="button">应用筛选</button></div>
<div class="toolbar"><input id="keyword-search" type="search" placeholder="搜索期刊名称或学科"><button id="search-button" type="button">查找</button><span id="search-message" role="status"></span></div>
<div class="toolbar"><label><input id="show-all-labels" type="checkbox">全部标签</label><label><input id="show-links" type="checkbox" checked>引用连线</label></div>
<div id="cluster-legend" class="note"></div>
<div class="toolbar"><button id="reset-view" type="button">显示全图</button></div>
<div id="summary" aria-live="polite"></div><div id="selection" aria-live="polite"></div>
<svg id="journal-semantic-map" data-workspace-chart width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="期刊语义双图：两侧期刊共享嵌入降维坐标，连线从引用方指向被引方。"></svg>
<div id="evidence">点击期刊查看内容画像依据；点击路径查看论文引用证据。</div>
<script src="../scripts/bootstrap.js?v=20261025-journal88" data-config='{"data": {"dualMapData": "../data/processed/dual-map.json", "journalSemanticMap": "../data/processed/journal-semantic-map.json"}, "scripts": ["../scripts/analysis/label-layout.js", "../scripts/analysis/journal-semantic-graph.js", "../scripts/charts/journal-semantic-map.js", "../scripts/interactions/workspace.js", "../scripts/interactions/liquid-select.js"], "workspace": true}'></script>
</body></html>
