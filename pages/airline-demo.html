<style>

<body class="glass-demo">
<header><h1>航空数据 · 普通连线与捆绑连线对照</h1><div id="airline-stats" class="note">正在读取本地航空数据…</div><div class="note">上游公开演示数据，非实时航线；固定机场空间坐标，不使用力导向重排。所有航线等权；线束不表示新增航线。<a href="network.html">返回论文网络</a></div></header>
